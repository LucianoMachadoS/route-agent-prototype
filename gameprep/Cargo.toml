[package]
name = "gameprep"
version = "0.1.0"
edition = "2021"
description = "GamePrep - otimizador de Windows para jogos: fecha apps de segundo plano quando um jogo abre"
license = "MIT"

[dependencies]
# Only for `windiag` (the diagnose tab) and `agentlog` (rotating log).
route-agent = { path = ".." }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
