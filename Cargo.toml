[package]
name = "route-agent"
version = "0.1.0"
edition = "2021"
description = "Prototype controller for an official WireGuard for Windows tunnel"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
